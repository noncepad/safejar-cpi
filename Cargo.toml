[package]
name = "safejar-cpi"
version = "0.3.1"
edition = "2021"
description = "Autogenerated CPI client for Safejar."
authors = ["Joel De Jesus <joel@noncepad.com>"]
repository = "https://github.com/noncepad/safejar-cpi"
license = "MIT"
keywords = ["solana", "anchor"]

[dependencies]
anchor-gen = { version = "0.3.1", optional = true }
anchor-lang = { version = ">=0.20", optional = true }


[features]
default = ["cpi", "all"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
all = ["anchor-gen", "anchor-lang"]
idl-build = ["anchor-lang/idl-build"]
